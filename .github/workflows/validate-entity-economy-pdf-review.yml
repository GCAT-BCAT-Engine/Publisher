name: Editorial Entity Economy PDF Source Verification
on:
  pull_request:
    paths:
      - 'papers/StegVerse_Private_State_Economy_White_Paper_v0.1.md'
      - 'tools/review_entity_economy_pdf_sources.py'
      - '.github/workflows/validate-entity-economy-pdf-review.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-original-source-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler PDF source inspector
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Fingerprint exact reviewed white-paper source bytes
        run: python -c "import hashlib,pathlib; p=pathlib.Path('papers/StegVerse_Private_State_Economy_White_Paper_v0.1.md'); print('WHITEPAPER_SOURCE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())"
      - name: Verify public original PDFs and extract each page without authority
        run: python tools/review_entity_economy_pdf_sources.py
      - name: Retain verified source-text evidence for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-economy-source-pdf-review
          path: entity-economy-original-pdf-review/
          if-no-files-found: warn
          retention-days: 14
