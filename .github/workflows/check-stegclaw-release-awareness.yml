name: Check StegClaw Release Awareness

on:
  push:
    branches: [main]
    paths:
      - data/stegclaw-release-awareness.json
      - scripts/check_stegclaw_release_awareness.py
      - .github/workflows/check-stegclaw-release-awareness.yml
      - PUBLISHER_MIRROR_HANDOFF.md
      - data/publisher-orchestration-state.json
  pull_request:
    paths:
      - data/stegclaw-release-awareness.json
      - scripts/check_stegclaw_release_awareness.py
      - .github/workflows/check-stegclaw-release-awareness.yml
      - PUBLISHER_MIRROR_HANDOFF.md
      - data/publisher-orchestration-state.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate StegClaw v1.0.0 release awareness
        run: python scripts/check_stegclaw_release_awareness.py
