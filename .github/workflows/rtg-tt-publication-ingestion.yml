name: RTG-TT Publication Ingestion
on:
  pull_request:
    paths:
      - 'data/rtg-tt/**'
      - 'tools/check_rtg_tt_publication_ingestion.py'
      - '.github/workflows/rtg-tt-publication-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'data/rtg-tt/**'
      - 'tools/check_rtg_tt_publication_ingestion.py'
      - '.github/workflows/rtg-tt-publication-ingestion.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_rtg_tt_publication_ingestion.py
