name: Build SV-COST Five-Lane LinkedIn PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers/five-lane-reconstructable-governance-analysis.md'
      - 'papers/five-lane-reconstructable-governance-linkedin-post.md'
      - 'papers/five-lane-reconstructable-governance-publication-manifest.json'
      - 'tools/build_five_lane_linkedin_pdf.py'
      - '.github/workflows/build-sv-cost-five-lane-linkedin-pdf.yml'

permissions:
  contents: write

concurrency:
  group: build-sv-cost-five-lane-linkedin-pdf
  cancel-in-progress: false

jobs:
  build-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded PDF build dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5 pypdf==5.1.0

      - name: Persist explicit publication boundary and normalized validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_five_lane_linkedin_pdf.py')
          s = p.read_text(encoding='utf-8')
          callout = '"All five lanes completed successfully, preserved task identity, produced the same normalized admissible outcome, and passed the publication gate. This does not establish universal provider economics, company-wide ROI, or fresh-inference equivalence.",'
          if callout not in s:
              old = '"All five lanes completed successfully, preserved task identity, produced the same normalized admissible outcome, and passed the publication gate.",'
              if old not in s:
                  raise SystemExit('expected publication callout not found')
              s = s.replace(old, callout, 1)
          if 'normalized_extracted = " ".join(extracted.split())' not in s:
              old = '    extracted = "\\n".join(page.extract_text() or "" for page in reader.pages)\n'
              new = old + '    normalized_extracted = " ".join(extracted.split())\n'
              if old not in s:
                  raise SystemExit('expected extracted-text statement not found')
              s = s.replace(old, new, 1)
          old_checks = '    checks = {marker: marker in extracted for marker in required_markers}\n'
          new_checks = '    checks = {marker: marker in normalized_extracted for marker in required_markers}\n'
          if old_checks in s:
              s = s.replace(old_checks, new_checks, 1)
          elif new_checks not in s:
              raise SystemExit('expected marker-check statement not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build and validate LinkedIn PDF
        run: python tools/build_five_lane_linkedin_pdf.py

      - name: Bind receipt to hosted execution
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          JOB_NAME: build-validate-commit
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rp=Path('artifacts/five-lane-reconstructable-governance/pdf-validation-receipt.json')
          mp=Path('papers/five-lane-reconstructable-governance-publication-manifest.json')
          r=json.loads(rp.read_text())
          m=json.loads(mp.read_text())
          binding={
              'workflow_name':'Build SV-COST Five-Lane LinkedIn PDF',
              'workflow_run_id':int(os.environ['RUN_ID']),
              'workflow_run_attempt':int(os.environ['RUN_ATTEMPT']),
              'workflow_job':os.environ['JOB_NAME'],
              'workflow_head_sha':os.environ['HEAD_SHA'],
          }
          r['hosted_execution']=binding
          m['linkedin_pdf']['hosted_execution']=binding
          rp.write_text(json.dumps(r,indent=2)+'\n')
          mp.write_text(json.dumps(m,indent=2)+'\n')
          PY

      - name: Validate machine-readable outputs
        run: |
          python -m json.tool papers/five-lane-reconstructable-governance-publication-manifest.json >/dev/null
          python -m json.tool artifacts/five-lane-reconstructable-governance/pdf-validation-receipt.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('papers/five-lane-reconstructable-governance-publication-manifest.json').read_text())
          r=json.loads(Path('artifacts/five-lane-reconstructable-governance/pdf-validation-receipt.json').read_text())
          p=Path(m['linkedin_pdf']['path'])
          assert m['artifact_state']=='COMPLETE'
          assert r['validation_state']=='COMPLETE'
          assert r['all_required_markers_present'] is True
          assert p.exists() and p.stat().st_size == r['bytes']
          assert r['pages'] >= 4
          assert r['hosted_execution']['workflow_run_id'] == m['linkedin_pdf']['hosted_execution']['workflow_run_id']
          print('SV_COST_FIVE_LANE_PDF_VALIDATION_PASS')
          PY

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sv-cost-five-lane-linkedin-pdf
          path: |
            artifacts/five-lane-reconstructable-governance/StegVerse_Five_Lane_Cost_Results_LinkedIn.pdf
            artifacts/five-lane-reconstructable-governance/pdf-validation-receipt.json
            papers/five-lane-reconstructable-governance-publication-manifest.json

      - name: Commit generated PDF and validation receipt
        shell: bash
        run: |
          git config user.name 'stegverse-pdf-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            tools/build_five_lane_linkedin_pdf.py \
            artifacts/five-lane-reconstructable-governance/StegVerse_Five_Lane_Cost_Results_LinkedIn.pdf \
            artifacts/five-lane-reconstructable-governance/pdf-validation-receipt.json \
            papers/five-lane-reconstructable-governance-publication-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Bind validated five-lane PDF to hosted execution'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
