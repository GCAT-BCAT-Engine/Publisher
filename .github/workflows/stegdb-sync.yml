name: StegDB Publisher Sync

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'patents/**'
      - 'social_media/**'
      - '.github/workflows/stegdb-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export to StegDB
        run: |
          python - <<'PY'
          from publisher.submission_tracker import SubmissionTracker

          tracker = SubmissionTracker()
          tracker.export_for_stegdb("stegdb_publisher_export.json")
          print("Exported publisher data for StegDB ingestion")
          PY
      - name: Upload bounded StegDB export
        uses: actions/upload-artifact@v4
        with:
          name: stegdb-publisher-export
          path: stegdb_publisher_export.json
          if-no-files-found: error
          retention-days: 30
