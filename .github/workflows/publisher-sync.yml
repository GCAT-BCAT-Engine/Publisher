name: Publisher Sync — AaCT-E Integration [CONTAINED — TV/TVC SOURCE AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publisher-sync-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block legacy artifact credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Publisher sync is contained because the prior workflow directly consumed a non-TV/TVC artifact token to fetch cross-repository evidence."
          echo "Exact private source/artifact materialization must occur through admitted TV/TVC authority and export only secret-free evidence to Publisher."
          exit 1
