name: Dispatch Site Paper Mirror [CONTAINED — TV/TVC DISPATCH AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publisher-site-mirror-dispatch-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block repository-secret cross-repository dispatch
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Publisher-to-Site mirror dispatch is contained because the prior workflow used a repository secret to authorize cross-repository workflow dispatch."
          echo "Publisher validation remains non-authorizing. Site dispatch requires explicit target-scoped TV/TVC authority, exact source ref/SHA binding, actor/application provenance, and a secret-free dispatch receipt."
          exit 1
