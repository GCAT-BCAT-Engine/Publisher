name: Generated StegPay Site Import

on:
  push:
    branches: [main]
    paths:
      - data/generated-stegpay-site-import/**
      - data/generated-stegpay-publication-status.json
      - scripts/check_generated_stegpay_site_import.py
      - .github/workflows/generated-stegpay-site-import.yml
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: generated-stegpay-site-import
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Site receipt and Publisher projection
        run: python scripts/check_generated_stegpay_site_import.py
      - name: Upload bounded publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-stegpay-publisher-projection
          path: |
            data/generated-stegpay-site-import/latest/site_import_receipt.json
            data/generated-stegpay-publication-status.json
