name: Collect Marketplace Coinbase Release Evidence

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/collect_marketplace_coinbase_release_evidence.py'
      - 'scripts/verify_marketplace_coinbase_connected_relay.py'
      - 'tests/test_marketplace_coinbase_release_evidence_collector.py'
      - 'tests/test_marketplace_coinbase_connected_relay.py'
      - 'data/marketplace-coinbase-connected-relay.json'
      - 'data/marketplace-coinbase-publications/**'
      - '.github/workflows/collect-marketplace-coinbase-release-evidence.yml'

permissions:
  contents: write

concurrency:
  group: marketplace-coinbase-release-evidence
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tests
        run: pip install pytest

      - name: Verify collector boundaries
        run: |
          pytest -q \
            tests/test_marketplace_coinbase_release_evidence_collector.py \
            tests/test_marketplace_coinbase_connected_relay.py

      - name: Verify connected GitHub relay
        id: relay
        run: |
          set +e
          python scripts/verify_marketplace_coinbase_connected_relay.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Collect and verify private-repository evidence
        id: collect
        if: steps.relay.outputs.exit_code == '3'
        env:
          MARKETPLACE_COINBASE_EVIDENCE_TOKEN: ${{ secrets.MARKETPLACE_COINBASE_EVIDENCE_TOKEN }}
        run: |
          set +e
          python scripts/collect_marketplace_coinbase_release_evidence.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove private source artifacts from workspace
        if: always()
        run: rm -rf data/marketplace-coinbase-release-evidence/

      - name: Commit changed evidence status only
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketplace-coinbase-release-evidence-status.json
          if git diff --cached --quiet; then
            echo "No Marketplace Coinbase evidence-status change."
            exit 0
          fi
          git commit -m "chore: update Marketplace Coinbase release evidence status [skip ci]"
          git pull --rebase
          git push

      - name: Preserve manual dispatch as validation-only
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual dispatch validates and uploads only the bounded status record; it does not persist repository state."

      - name: Upload bounded evidence status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-coinbase-release-evidence-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/marketplace-coinbase-release-evidence-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail after preserving rejected evidence
        if: steps.relay.outputs.exit_code == '1' || steps.collect.outputs.exit_code == '1'
        run: |
          echo "Marketplace Coinbase evidence verification was rejected; bounded status was preserved."
          exit 1
