name: Collect Marketplace Coinbase Release Evidence

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/collect_marketplace_coinbase_release_evidence.py'
      - 'tests/test_marketplace_coinbase_release_evidence_collector.py'
      - '.github/workflows/collect-marketplace-coinbase-release-evidence.yml'

permissions:
  contents: write

concurrency:
  group: marketplace-coinbase-release-evidence
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tests
        run: pip install pytest

      - name: Verify collector boundaries
        run: pytest -q tests/test_marketplace_coinbase_release_evidence_collector.py

      - name: Collect private-repository evidence
        env:
          MARKETPLACE_COINBASE_EVIDENCE_TOKEN: ${{ secrets.MARKETPLACE_COINBASE_EVIDENCE_TOKEN }}
        run: python scripts/collect_marketplace_coinbase_release_evidence.py

      - name: Commit changed evidence status
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketplace-coinbase-release-evidence-status.json data/marketplace-coinbase-release-evidence/
          if git diff --cached --quiet; then
            echo "No Marketplace Coinbase evidence change."
            exit 0
          fi
          git commit -m "chore: update Marketplace Coinbase release evidence [skip ci]"
          git pull --rebase
          git push

      - name: Preserve manual dispatch as validation-only
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual dispatch validates and uploads evidence but does not persist repository state."

      - name: Upload collected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-coinbase-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/marketplace-coinbase-release-evidence-status.json
            data/marketplace-coinbase-release-evidence/
          if-no-files-found: warn
          retention-days: 30
