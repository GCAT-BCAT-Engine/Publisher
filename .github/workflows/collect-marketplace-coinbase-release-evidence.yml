name: Collect Marketplace Coinbase Release Evidence [CONTAINED — TV/TVC SOURCE AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: marketplace-release-evidence-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block private evidence credential and status mutation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Marketplace release-evidence collection is contained because the prior workflow directly consumed a private evidence token and committed evidence-status state under GitHub Actions authority."
          echo "Private evidence must be materialized through TV/TVC exact-source authority; Publisher may validate secret-free evidence, while durable status mutation requires separately admitted authority."
          exit 1
