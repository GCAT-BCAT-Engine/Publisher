name: Close Site Mirror Activation [CONTAINED — TV/TVC MUTATION AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publisher-site-mirror-closure-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block GitHub-token activation mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Publisher-to-Site activation closure is contained because the prior workflow used a repository secret or github.token and directly committed activation/closure state."
          echo "Fresh ordered evidence remains necessary but is not sufficient authority. Closure/activation mutation requires separately admitted TV/TVC authority and an attributable closure receipt."
          exit 1
