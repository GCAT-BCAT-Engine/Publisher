name: Import Marketplace Coinbase Settlements

on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/marketplace-coinbase/**'
      - 'scripts/import_marketplace_coinbase_settlements.py'
      - 'marketplace_coinbase_publication.py'
      - 'tests/test_marketplace_coinbase_import_runner.py'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install pytest
      - name: Verify publication gate
        run: pytest -q tests/test_marketplace_coinbase_publication.py tests/test_marketplace_coinbase_import_runner.py
      - name: Import verified settlements
        run: python scripts/import_marketplace_coinbase_settlements.py
      - name: Commit changed publication projections
        run: |
          git config user.name "stegverse-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/marketplace-coinbase-publications data/marketplace-coinbase-publications.sqlite3
          git diff --cached --quiet || git commit -m "Record Marketplace Coinbase publication projections"
          git push
